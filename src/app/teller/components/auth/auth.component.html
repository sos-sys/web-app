<div>
  <h2>Cashier Workspace</h2>
  <p>Sign in with your username and password to start your shift.</p>

  <div>
    <label>Username</label><br/>
    <input 
      type="text" 
      [(ngModel)]="username" 
      placeholder="e.g. jsmith" 
      (keyup.enter)="doLogin()">
  </div>

  <div>
    <label>Password</label><br/>
    <input 
      type="password" 
      [(ngModel)]="password" 
      placeholder="Enter your password" 
      (keyup.enter)="doLogin()">
  </div>

  <div>
    <p *ngIf="errorMessage"><strong>Wait:</strong> {{ errorMessage }}</p>
    
    <button 
      (click)="doLogin()" 
      [disabled]="isLoading || !username || !password">
      {{ isLoading ? 'Checking credentials...' : 'Sign In' }}
    </button>
  </div>
</div>
